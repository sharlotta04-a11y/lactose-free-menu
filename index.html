<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebKredit: Контроль лактози</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .dish { padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; transition: 0.3s; }
        .lactose-warning { background-color: #ffebee; border-left: 6px solid #f44336; }
        .badge { background: #f44336; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-left: 10px; }
        .ai-note { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍽️ Меню WebKredit</h1>
    <p class="ai-note">Ця сторінка згенерована за допомогою ШІ. Вона автоматично перевіряє страви і підсвічує ті, що містять лактозу (Шукає Алерген 7 або слово "mléko").</p>
    
    <div id="menu-container">
        <!-- Сюди завантажуватимуться страви -->
        <p>Аналіз меню...</p>
    </div>
</div>

<script>
    // ЦЕЙ КОД ЗГЕНЕРОВАНО ШІ (Gemini) ДЛЯ АВТОМАТИЗАЦІЇ
    // Реальні дані з вашого WebKredit
    
  const realMenuData = [
        { name: "Polévka celerový krém s krutony", allergens: "lepek, celer, mléko" },
        { name: "Smažený kuřecí řízek, bramborová kaše, okurek sterilovaný", allergens: "lepek, vejce, mléko, hořčice" },
        { name: "Kuřecí nudličky se sýrovou omáčkou, těstoviny vřetena", allergens: "lepek, mléko" },
        { name: "Hovězí pečeně štěpánská, rýže dušená", allergens: "lepek, vejce, 7" },
        { name: "Vepřový guláš, houskové knedlíky", allergens: "lepek, vejce, mléko" },
        { name: "Fazole nakyselo, opečená klobása, chléb", allergens: "lepek" },
        { name: "Zeleninový salát s kuřecím masem a jogurtovým dresinkem", allergens: "mléko, hořčice" },
        { name: "Rizoto s vepřovým masem a sýrem, kyselá okurka", allergens: "7" },
        { name: "Tvarohové knedlíky plněné ovocem, cukr, máslo", allergens: "lepek, vejce, mléko" },
        { name: "Pečené kuřecí stehno, brambory mírně maštěné", allergens: "без алергенів" },
        { name: "Špagety s boloňskou omáčkou a sýrem", allergens: "lepek, vejce, 7" },
        { name: "Slovenská kapustnica (Slovak Cabbage Soup)", allergens: "lepek, mléko, celer, hořčice" },
        { name: "Kimchi - kvašená zelenina 170g", allergens: "celer" },
        { name: "Sterilovaná polévka ve skle 0,7l", allergens: "lepek" },
        { name: "Jogurtové mléko ochucené 400 ml, vánočka", allergens: "lepek, soja, mléko" }
    ];

    function renderMenu() {
        const container = document.getElementById('menu-container');
        container.innerHTML = ''; // Очищаємо контейнер

        realMenuData.forEach(dish => {
            // РОЗУМНА ШІ-ЛОГІКА: Перевіряємо, чи є '7' або 'mléko' (без врахування регістру)
            const allergensLower = dish.allergens.toLowerCase();
            const hasLactose = allergensLower.includes('7') || allergensLower.includes('mléko');
            
            const dishElement = document.createElement('div');
            dishElement.className = hasLactose ? 'dish lactose-warning' : 'dish';
            
            let dishHTML = `<h3>${dish.name}`;
            if (hasLactose) {
                dishHTML += `<span class="badge">⚠️ МІСТИТЬ ЛАКТОЗУ</span>`;
            }
            dishHTML += `</h3><p><strong>Алергени:</strong> ${dish.allergens}</p>`;
            
            dishElement.innerHTML = dishHTML;
            container.appendChild(dishElement);
        });
    }

    setTimeout(renderMenu, 800); 
</script>

</body>
</html>
